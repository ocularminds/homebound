<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Vega WebView Template</title>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 40px;
            box-sizing: border-box;
        }
        .container {
            text-align: center;
            max-width: 800px;
        }
        h1 {
            font-size: 64px;
            margin-bottom: 30px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .info {
            font-size: 24px;
            line-height: 1.6;
            margin-bottom: 20px;
            opacity: 0.95;
        }
        .feature {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            margin: 15px 0;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        .feature-title {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from WebView</h1>
        <p class="info">This is a Vega WebView template app running web content natively</p>

        <div class="feature">
            <div class="feature-title">🌐 Web Content</div>
            Load local HTML files or remote URLs
        </div>

        <div class="feature">
            <div class="feature-title">🎨 Full Styling</div>
            Use CSS, JavaScript, and modern web features
        </div>

        <div class="feature">
            <div class="feature-title">📱 Native Integration</div>
            Bridge between web and native React Native code
        </div>
    </div>
</body>
</html>
